name: daily-gas-crawl
on:
  schedule:
    - cron: "15 13 * * *"   # 07:15 America/Denver (MDT = UTC-6)
    - cron: "15 23 * * *"   # 17:15 America/Denver
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape GasBuddy and append observation
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FIRECRAWL_API_KEY:-}" ]; then
            echo "Add repo secret FIRECRAWL_API_KEY"
            exit 1
          fi
          python3 << 'PY'
          import json, os, re, time, urllib.request, datetime
          from pathlib import Path

          KEY = os.environ["FIRECRAWL_API_KEY"]
          CITIES = {"centennial", "littleton", "greenwood village"}
          URLS = [
            "https://www.gasbuddy.com/gasprices/colorado/centennial",
            "https://www.gasbuddy.com/gasprices/colorado/littleton",
            "https://www.gasbuddy.com/gasprices/colorado/greenwood-village",
            "https://www.gasbuddy.com/station/27835",
            "https://www.gasbuddy.com/station/27615",
            "https://www.gasbuddy.com/station/160558",
            "https://www.gasbuddy.com/station/110924",
            "https://www.gasbuddy.com/station/209114",
            "https://www.gasbuddy.com/station/205744",
            "https://www.gasbuddy.com/station/16667",
            "https://www.gasbuddy.com/station/109225",
            "https://www.gasbuddy.com/station/44899",
            "https://www.gasbuddy.com/station/44896",
            "https://www.gasbuddy.com/station/44868",
            "https://www.gasbuddy.com/station/16666",
            "https://www.gasbuddy.com/station/40178",
            "https://www.gasbuddy.com/station/16663",
            "https://www.gasbuddy.com/station/403",
          ]
          STABLE = [
            ("shell-5901", "5901", "university"),
            ("shell-2410", "2410", "arapahoe"),
            ("murphy-12022", "12022", "arapahoe"),
            ("exxon-6556", "6556", "broadway"),
            ("711-5898", "5898", "broadway"),
            ("ks-holly", "8250", "holly"),
            ("711-dayton", "6515", "dayton"),
            ("murphy-briarwood", "11005", "briarwood"),
          ]
          schema = {
            "type": "object",
            "properties": {
              "stations": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "name": {"type": "string"},
                    "addr": {"type": "string"},
                    "city": {"type": "string"},
                    "regular": {"type": ["number", "null"]},
                    "premium": {"type": ["number", "null"]}
                  }
                }
              }
            }
          }

          def num(v):
            if isinstance(v, (int, float)):
              return float(v)
            if isinstance(v, str):
              m = re.search(r"(\d+\.\d{2,3})", v.replace(",", ""))
              if m:
                return float(m.group(1))
            return None

          def stable_id(name, addr):
            a = (addr or "").lower()
            for sid, n, street in STABLE:
              if n in a and street in a:
                return sid
            slug = re.sub(r"[^a-z0-9]+", "-", ((name or "") + "-" + (addr or "")).lower()).strip("-")
            return slug[:40]

          def scrape(url):
            prompt = (
              "This is a GasBuddy page. Extract every station visible. "
              "On a station detail page the price row is Regular, Midgrade, Premium, Diesel. "
              "Map Regular to regular and Premium (not midgrade, not diesel) to premium. "
              "Use numbers only. If Premium shows blank or dash, premium is null. "
              "Do not invent prices. Only Centennial, Littleton, Greenwood Village."
            )
            body = json.dumps({
              "url": url,
              "formats": ["json"],
              "jsonOptions": {"schema": schema, "prompt": prompt},
            }).encode()
            req = urllib.request.Request(
              "https://api.firecrawl.dev/v1/scrape",
              data=body,
              headers={"Authorization": f"Bearer {KEY}", "Content-Type": "application/json"},
              method="POST",
            )
            with urllib.request.urlopen(req, timeout=90) as r:
              payload = json.loads(r.read().decode())
            return (payload.get("data") or {}).get("json") or {}

          seen = {}
          blocked = []
          for url in URLS:
            try:
              data = scrape(url)
            except Exception as e:
              blocked.append(url.split("/")[-1] + ": " + str(e)[:80])
              time.sleep(8)
              continue
            rows = data.get("stations") or []
            if not rows and (data.get("name") or data.get("addr")):
              rows = [data]
            for s in rows:
              city = (s.get("city") or "").strip()
              if city.lower() not in CITIES:
                continue
              name = (s.get("name") or "").strip()
              addr = (s.get("addr") or "").strip()
              if not name or not addr:
                continue
              sid = stable_id(name, addr)
              rec = {
                "id": sid,
                "name": name,
                "addr": addr,
                "city": city,
                "regular": num(s.get("regular")),
                "premium": num(s.get("premium")),
                "source": "gasbuddy",
              }
              prev = seen.get(sid)
              if prev:
                if rec["regular"] is None:
                  rec["regular"] = prev.get("regular")
                if rec["premium"] is None:
                  rec["premium"] = prev.get("premium")
                regs = [x for x in (prev.get("regular"), rec.get("regular")) if isinstance(x, (int, float))]
                if len(regs) == 2 and abs(regs[0] - regs[1]) > 0.009:
                  rec["conflict"] = f"${min(regs):.2f}-{max(regs):.2f}"
                  rec["source"] = "gasbuddy conflict"
              seen[sid] = rec
            time.sleep(5)

          path = Path("gas-history.json")
          tape = json.loads(path.read_text()) if path.exists() else {
            "source": "observed GasBuddy public listings only",
            "area": "Centennial, Littleton, Greenwood Village",
            "grades": ["regular", "premium"],
            "observations": [],
          }
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-6)))
          prem = sum(1 for s in seen.values() if s.get("premium") is not None)
          status = "ok" if seen else "blocked"
          if seen and prem == 0:
            status = "partial"
          obs = {
            "date": now.strftime("%Y-%m-%d"),
            "crawled_at": now.strftime("%Y-%m-%dT%H:%M:%S-06:00"),
            "status": status,
            "note": "firecrawl+gasbuddy stations+lists; premium=%d/%d" % (prem, len(seen)) + ("; blocked: " + "; ".join(blocked) if blocked else ""),
            "stations": list(seen.values()),
          }
          tape.setdefault("observations", []).append(obs)
          dates, kept = [], []
          for item in reversed(tape["observations"]):
            if item.get("date") in dates:
              kept.append(item)
              continue
            if len(dates) >= 14:
              continue
            dates.append(item.get("date"))
            kept.append(item)
          tape["observations"] = list(reversed(kept))
          path.write_text(json.dumps(tape, indent=2) + "\n")
          print(obs["status"], "stations", len(seen), "premium", prem, "blocked", len(blocked))
          PY
      - name: Commit tape
        run: |
          git config user.name "waze-gas-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gas-history.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Daily observed GasBuddy crawl"
          git push
